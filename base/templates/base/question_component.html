<h5>Question {{ question_number }}</h5>
<p>{{ question.text }}</p>

<form method="POST">
  {% csrf_token %} {% for option in question.options.all %}
  <div class="form-check">
    <input
      class="form-check-input"
      type="radio"
      name="answer"
      value="{{ option.id }}"
      id="option{{ forloop.counter }}"
    />
    <label class="form-check-label" for="option{{ forloop.counter }}">
      {{ option.text }}
    </label>
  </div>
  {% endfor %}

  <button type="submit" class="btn btn-primary mt-2">Next</button>
</form>
