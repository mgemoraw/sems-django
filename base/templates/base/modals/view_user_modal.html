<!-- VIEW USER MODAL -->
<input type="checkbox" id="view-user-modal" class="modal-toggle" />

<div class="modal">
  <div class="modal-box w-full max-w-md">
    <h3 class="font-bold text-lg mb-4">User Details</h3>

    <div class="space-y-3 text-sm">
      <p><strong>Username:</strong> <span id="view-username"></span></p>
      <p><strong>Email:</strong> <span id="view-email"></span></p>
      <p><strong>Role:</strong> <span id="view-role"></span></p>
      <p><strong>Status:</strong> <span id="view-status"></span></p>
    </div>

    <div class="modal-action">
      <label for="view-user-modal" class="btn">Close</label>
    </div>
  </div>
</div>
