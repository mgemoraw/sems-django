<div class="profile-card text-center p-3 bg-light rounded">
  <div class="avatar mb-2">{{ request.user.username|slice:":1"|upper }}</div>
  <h6>{{ request.user.username }}</h6>
  <p class="text-muted">{{ request.user.email }}</p>
  <a href="{% url 'profile-edit' %}" class="btn btn-outline-primary btn-sm"
    >Edit Profile</a
  >
</div>
