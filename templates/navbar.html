{% load static %}

<nav class="navbar">
  <div class="nav-container">
    <!-- Logo -->
    <div class="nav-left">
      <a href="/" class="logo">
        <span>SEMS</span>
        <small>BiT</small>
      </a>
    </div>

    <!-- Search -->
    <div class="nav-center">
      <form action="{% url 'base:home' %}" method="GET" class="search-form">
        <input
          type="text"
          name="q"
          placeholder="Search exams, courses..."
          class="search-input"
        />
        <button type="submit" class="search-btn">🔍</button>
      </form>
    </div>

    <!-- Right Side -->
    <div class="nav-right">
      {% if request.user.is_authenticated %}

      <span class="welcome"> Hi, {{ request.user.username }} </span>

      <a href="#" class="nav-link">Dashboard</a>

      <a href="{% url 'base:logout' %}" class="btn logout-btn"> Logout </a>

      {% else %}

      <a href="{% url 'base:login' %}" class="btn login-btn"> Login </a>

      {% endif %}
    </div>
  </div>
</nav>

<hr />
